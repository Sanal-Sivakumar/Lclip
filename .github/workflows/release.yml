name: Release LClip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source, tests, audit, and tag
        run: |
          npm run verify
          npm audit --audit-level=high
          node scripts/verify-release.mjs --allow-untagged

  build:
    needs: verify
    name: Build Linux ${{ matrix.arch }} installers
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            builder_flag: --x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            builder_flag: --arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage, Debian, RPM, and portable archives
        run: npx electron-builder --linux AppImage deb rpm tar.gz ${{ matrix.builder_flag }} --publish never

      - name: Install headless runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb dbus-x11

      - name: Launch packaged application under Xvfb
        shell: bash
        run: |
          bundle="$(find dist -maxdepth 1 -type d -name 'linux*-unpacked' -print -quit)"
          bash scripts/smoke-packaged-linux.sh "$bundle"

      - name: Upload architecture-specific installers
        uses: actions/upload-artifact@v7
        with:
          name: lclip-linux-${{ matrix.arch }}-installers
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: lclip-linux-*-installers
          path: release/downloads

      - name: Create stable asset names and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/publish
          for arch in x64 arm64; do
            source_dir="release/downloads/lclip-linux-${arch}-installers"
            for extension in AppImage deb rpm tar.gz; do
              source_file="$(find "${source_dir}" -type f -name "*.${extension}" -print -quit)"
              if [[ -z "${source_file}" ]]; then
                echo "Missing ${extension} installer for ${arch}" >&2
                exit 1
              fi
              cp "${source_file}" "release/publish/LClip-linux-${arch}.${extension}"
            done
          done
          cp assets/io.lclip.LClip.svg release/publish/LClip.svg
          cp scripts/install-release.sh release/publish/install-lclip.sh
          cp scripts/uninstall-user.sh release/publish/uninstall-lclip.sh
          chmod 0755 release/publish/install-lclip.sh release/publish/uninstall-lclip.sh
          (cd release/publish && sha256sum LClip-* install-lclip.sh uninstall-lclip.sh > SHA256SUMS)

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release/publish/*

      - name: Publish tagged GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/publish/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Stable LClip installers for Linux x86-64 and ARM64.

            The no-root `install-lclip.sh` path uses the portable archive and does not require Node.js, npm, or FUSE. AppImage, Debian, RPM, and tar.gz files are also available for manual installation.

            Verify downloads against `SHA256SUMS`. Both architectures are built natively and the packaged runtime is launched under Xvfb before publication. Desktop-specific shortcut and automatic-paste behavior still follows the support policy in `docs/linux-smoke-test.md`.
