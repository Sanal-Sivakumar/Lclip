<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.giphy.com https://giphy.com; connect-src 'none';">
  <meta name="color-scheme" content="dark">
  <title>LClip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="window-shell">
    <aside class="mode-rail" aria-label="LClip sections">
      <div class="brand" aria-label="LClip">
        <span class="brand-mark" aria-hidden="true"><i></i><b></b></span>
        <strong>LClip</strong>
      </div>
      <nav class="mode-list">
        <button class="mode-button active" data-mode="clipboard" aria-label="Clipboard history" title="Clipboard history" aria-pressed="true"><span aria-hidden="true">▣</span></button>
        <button class="mode-button" data-mode="emoji" aria-label="Emoji" title="Emoji" aria-pressed="false"><span aria-hidden="true">☺</span></button>
        <button class="mode-button" data-mode="kaomoji" aria-label="Kaomoji" title="Kaomoji" aria-pressed="false"><span aria-hidden="true">ツ</span></button>
        <button class="mode-button" data-mode="gifs" aria-label="GIFs" title="GIFs" aria-pressed="false"><span aria-hidden="true">GIF</span></button>
        <button class="mode-button" data-mode="symbols" aria-label="Special characters" title="Special characters" aria-pressed="false"><span aria-hidden="true">Ω</span></button>
      </nav>
      <button class="rail-action" id="settingsButton" aria-label="Open LClip settings" title="Settings"><span aria-hidden="true">⚙</span></button>
    </aside>

    <main class="picker">
      <header class="window-header">
        <div class="titlebar-drag" aria-label="Drag LClip window">
          <span class="drag-indicator" aria-hidden="true"></span>
          <button class="window-close" id="closeButton" aria-label="Close LClip">×</button>
        </div>
        <div class="search-row">
          <div class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" role="combobox" aria-autocomplete="list" aria-controls="lclip-options" aria-expanded="true" autocomplete="off" spellcheck="false" placeholder="Search clipboard history" aria-label="Search LClip">
          </div>
        </div>
      </header>

      <section class="content-area" aria-labelledby="sectionTitle">
        <div class="section-heading">
          <div>
            <h1 id="sectionTitle">Clipboard history</h1>
            <p id="sectionDescription">Your 10 most recent copied text items, stored only on this device.</p>
          </div>
          <div class="heading-actions" id="headingActions"></div>
        </div>
        <div class="results" id="results" role="region" aria-label="Clipboard history results"></div>
        <div class="results-meta" id="resultsMeta"></div>
      </section>

    </main>

    <aside class="settings-sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true" inert hidden>
      <header><div><h2 id="settingsTitle">LClip settings</h2><p>Keep the essentials within reach.</p></div><button id="settingsClose" aria-label="Close settings">×</button></header>
      <div class="settings-content">
        <section>
          <h3>Preferences</h3>
          <label class="setting-row"><div><strong>Start after login</strong><small>Keep the shortcut ready in every session</small></div><input id="autostartSetting" type="checkbox"></label>
          <label class="setting-row"><div><strong>Capture copied text</strong><small>Local only · maximum 10 entries</small></div><input id="captureSetting" type="checkbox"></label>
          <button class="danger-action" id="clearHistoryButton">Clear clipboard history</button>
        </section>
        <section>
          <h3>GIF search <span>Optional</span></h3>
          <label class="field-label" for="giphyKey">GIPHY API key</label>
          <input class="text-field" id="giphyKey" type="password" autocomplete="off" placeholder="Paste your optional API key">
          <label class="field-label" for="gifRating">Maximum content rating</label>
          <select class="text-field" id="gifRating"><option value="g">G</option><option value="pg">PG</option><option value="pg-13">PG-13</option></select>
          <p class="service-note">Only GIF search uses the network.</p>
        </section>
      </div>
      <footer><button class="primary-action" id="saveSettingsButton">Save settings</button></footer>
    </aside>
    <div class="sheet-scrim" id="sheetScrim"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
